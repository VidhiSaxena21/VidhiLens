
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vidhilens_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: vidhi
      POSTGRES_PASSWORD: vidhilens_dev_password
      POSTGRES_DB: vidhilens

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidhi -d vidhilens"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
